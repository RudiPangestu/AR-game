# XcodeGen spec — the source of truth for the Xcode project.
#
# A generated `ScanToSummon.xcodeproj` is committed alongside this so the repo
# can be opened with no tooling installed. If the two ever disagree, this file
# wins:
#
#     brew install xcodegen && xcodegen generate
#
# One caveat after regenerating: XcodeGen derives known regions from the files
# it sees, and Indonesian lives inside the String Catalog rather than in an
# `id.lproj` folder. If Indonesian stops appearing, add it back under
# Project ▸ Info ▸ Localizations ▸ + ▸ Indonesian.

name: ScanToSummon

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # iPhone only. The whole design assumes one hand holding a phone up.
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  ScanToSummon:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Core
      - path: AR
      - path: Features
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ScanToSummon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "Scan-to-Summon uses the camera to recognise objects around you and hatch creatures from them."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_STYLE: Automatic

  ScanToSummonTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: ScanToSummon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ScanToSummonTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  ScanToSummon:
    build:
      targets:
        ScanToSummon: all
    test:
      targets:
        - ScanToSummonTests
    run:
      config: Debug
