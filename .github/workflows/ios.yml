name: iOS

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # macOS runner: the only place this project can actually be compiled.
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      # Simulator names drift between runner images, so the device is resolved
      # at run time rather than hard-coded into the destination string.
      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | python3 -c "
          import json, sys
          data = json.load(sys.stdin)['devices']
          runtimes = sorted(k for k in data if 'iOS' in k)
          for runtime in reversed(runtimes):
              for device in data[runtime]:
                  if device.get('isAvailable') and 'iPhone' in device['name']:
                      print(device['udid'])
                      raise SystemExit
          raise SystemExit('no available iPhone simulator')
          ")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep -i iphone | head -5

      # The Simulator build alone is not enough coverage: ARScanController and
      # HatchEffect sit behind `#if !targetEnvironment(simulator)`, so a
      # Simulator-only CI compiles neither of them and can go green while the AR
      # layer is broken. That is exactly what happened once. This step compiles
      # against the device SDK so those files are type-checked too.
      - name: Compile for device SDK
        working-directory: ScanToSummon
        run: |
          set -o pipefail
          xcodebuild build \
            -project ScanToSummon.xcodeproj \
            -scheme ScanToSummon \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee device-build.log

      - name: Build and test
        working-directory: ScanToSummon
        run: |
          set -o pipefail
          xcodebuild test \
            -project ScanToSummon.xcodeproj \
            -scheme ScanToSummon \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log

      - name: Surface failures
        if: failure()
        working-directory: ScanToSummon
        run: |
          echo "::group::compiler errors"
          grep -hE "error:" device-build.log build.log 2>/dev/null | grep -v "^ *~*\^" | sort -u | head -60 || true
          echo "::endgroup::"
          echo "::group::failed tests"
          grep -E "^Test Case .* failed|XCTAssert.* failed" build.log 2>/dev/null | sort -u | head -60 || true
          echo "::endgroup::"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ScanToSummon/build.log
            ScanToSummon/device-build.log
          if-no-files-found: ignore
